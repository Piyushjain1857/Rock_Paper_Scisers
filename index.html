<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Neon Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1 class="title">
            🪨 Rock | 📄 Paper | ✂️ Scissors
        </h1>

        <p class="subtitle">
            Can you beat the computer?
        </p>

        <div class="scoreboard">

            <div class="score-box">
                <h3>You</h3>
                <span id="user-score">0</span>
            </div>

            <div class="score-box">
                <h3>Computer</h3>
                <span id="computer-score">0</span>
            </div>

        </div>

        <div class="choices">

            <button class="choice" data-choice="rock">
                🪨
            </button>

            <button class="choice" data-choice="paper">
                📄
            </button>

            <button class="choice" data-choice="scissors">
                ✂️
            </button>

        </div>

        <div class="results">

            <p>
                <strong>You:</strong>
                <span id="user-choice">-</span>
            </p>

            <p>
                <strong>Computer:</strong>
                <span id="computer-choice">-</span>
            </p>

            <h2 id="result-text">
                Let's Play!
            </h2>

            <button id="reset" class="reset-btn">
                🔄 Reset Game
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
