<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors | Neon Edition</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Main Card -->

    <div class="game-container">

        <div class="header">

            <h1 class="title">Rock Paper Scissors</h1>

            <p class="subtitle">Can you beat the computer?</p>

        </div>

        <!-- Score -->

        <div class="scoreboard">

            <div class="score-card">

                <h3>You</h3>

                <h2 id="user-score">0</h2>

            </div>

            <div class="score-card">

                <h3>Computer</h3>

                <h2 id="computer-score">0</h2>

            </div>

        </div>

        <!-- Choices -->

        <div class="choices">

            <button class="choice" data-choice="rock" aria-label="Rock">

                🪨

            </button>

            <button class="choice" data-choice="paper" aria-label="Paper">

                📄

            </button>

            <button class="choice" data-choice="scissors" aria-label="Scissors">

                ✂️

            </button>

        </div>

        <!-- Battle -->

        <div class="battle">

            <div class="player">

                <h4>You</h4>

                <div id="user-icon" class="battle-icon">
                    <span id="user-choice">❔</span>
                </div>

            </div>

            <div class="vs">

                VS

            </div>

            <div class="player">

                <h4>Computer</h4>

                <div id="computer-icon" class="battle-icon">
                    <span id="computer-choice">❔</span>
                </div>

            </div>

        </div>

        <!-- Result -->

        <div class="results">

            <h2 id="result-text" role="status" aria-live="polite">Let's Play!</h2>

            <p id="round-message">Choose Rock, Paper or Scissors</p>

        </div>

        <!-- Controls -->

        <div class="controls">

            <button id="reset" class="reset-btn">

                🔄 Reset Game

            </button>

        </div>
        
    </div>

    <!-- Footer -->

    <footer class="footer">
        <p>Made with <span class="heart">❤️</span> by Piyush Jain</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
